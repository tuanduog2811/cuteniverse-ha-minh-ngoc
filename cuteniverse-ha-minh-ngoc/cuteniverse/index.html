    // ===== Quản lý nhạc =====
    const musicManager = {
      audio: null,
      isPlaying: false,

      init() {
        this.audio = new Audio('./assets/music.mp3');
        this.audio.loop = true;
        this.audio.volume = 0.7;
        this.audio.preload = 'auto';
        this.audio.setAttribute('playsinline', '');

        this.audio.onplay  = () => { this.isPlaying = true;  this.updateUI(); };
        this.audio.onpause = () => { this.isPlaying = false; this.updateUI(); };

        // Tự động phát khi người dùng tương tác lần đầu
        document.addEventListener('DOMContentLoaded', () => {
          if (!this.isPlaying) {
            this.audio.play().catch(err => console.warn('Không thể phát nhạc:', err));
          }
        }, { once: true });

        this.updateUI();
      },

      togglePlayback() {
        if (!this.audio) return;
        if (this.audio.paused) {
          this.audio.play().catch(err => console.warn('Lỗi phát nhạc:', err));
        } else {
          this.audio.pause();
        }
      },

      updateUI() {
        const icon = document.getElementById('audio-icon');
        if (!icon) return;
        if (this.isPlaying) {
          icon.classList.remove('fa-volume-xmark');
          icon.classList.add('fa-volume-high');
        } else {
          icon.classList.remove('fa-volume-high');
          icon.classList.add('fa-volume-xmark');
        }
      },
    };

    document.addEventListener('DOMContentLoaded', () => {
      musicManager.init();
      document.getElementById('toggle-audio').addEventListener('click', () => {
        musicManager.togglePlayback();
      });
    });
  </script>
</body>
